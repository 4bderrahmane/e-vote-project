[package]
name = "privote_mopro_semaphore"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["lib", "cdylib", "staticlib"]

[features]
default = ["uniffi"]
build = ["mopro-ffi/build", "uniffi"]
uniffi = ["mopro-ffi/uniffi"]
wasm = ["mopro-ffi/wasm"]

[[bin]]
name = "android"
path = "src/bin/android.rs"
required-features = ["build"]

[dependencies]
ark-bn254 = "0.5"
ark-ec = "0.5"
ark-ff = "0.5"
blake512-hash = "0.1"
circom-prover = "0.1"
hex = "0.4"
light-poseidon = "0.4"
mopro-ffi = { version = "0.3", default-features = false }
num-bigint = "0.4"
rust-witness = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
taceo-ark-babyjubjub = "0.5"
thiserror = "2"

[build-dependencies]
rust-witness = "0.1"
